# TriageAI deployment.
#
# Quick start (run from the repo root):
#   1. cp .env.example .env   # set at least LLM_GEMINI_API_KEY
#   2. docker compose -f deploy/docker-compose.yml up --build
#   3. open http://localhost:8501
#
# Persistence: HITL checkpoints live in Supabase Postgres (set DATABASE_URL in
# .env → PostgresSaver). Only the ChromaDB policy store needs a local volume.
# If DATABASE_URL is unset the code falls back to SqliteSaver at
# /app/data/checkpoints.db, which is ephemeral here — re-add a volume on /app/data
# if you ever run without Postgres.
services:
  triageai:
    build:
      # Context is the repo root (one level up) so the whole app is available
      # to COPY; the Dockerfile lives here in deploy/.
      context: ..
      dockerfile: deploy/Dockerfile
    image: triageai:latest
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - vector_store:/app/data/vector_store
    restart: unless-stopped

volumes:
  vector_store:
