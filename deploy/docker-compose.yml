# TriageAI deployment — two-service topology (Sprint 9), mirrors production.
#
# Quick start (run from the repo root):
#   1. cp .env.example .env   # set at least LLM_GEMINI_API_KEY
#   2. docker compose -f deploy/docker-compose.yml up --build
#   3. open http://localhost:8501          (app)
#      open http://localhost:6006          (Phoenix traces, optional profile)
#
# Topology (same shape as AWS: App Runner ↔ Fargate MCP service):
#   app  — Streamlit UI + LangGraph workflow. Talks to the MCP tool server over
#          Streamable HTTP (MCP_SERVER_URL). If the MCP service is down, the app
#          degrades to in-process tools — you can demo that by stopping `mcp`.
#   mcp  — standalone FastMCP tool server (Dockerfile.mcp) with the ChromaDB
#          policy store baked into the image.
#   phoenix — optional OTel trace backend (profile "observability").
#          Enable with: docker compose --profile observability up
#
# Persistence: HITL checkpoints live in Postgres (set DATABASE_URL in .env →
# PostgresSaver). Without it the app falls back to SqliteSaver inside the
# container, which is ephemeral here.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: triageai-app:latest
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      MCP_SERVER_URL: http://mcp:8000/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-local-token}
      # OTel → Phoenix (set OTEL_ENABLED=1 in .env and start with --profile observability)
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_SERVICE_NAME: triageai-app
    depends_on:
      - mcp
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    image: triageai-mcp:latest
    ports:
      - "8000:8000"   # exposed for local curl/debugging; not required by app
    env_file:
      - ../.env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-local-token}
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_SERVICE_NAME: triageai-mcp
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["observability"]
    ports:
      - "6006:6006"   # UI + OTLP HTTP collector
      - "4317:4317"   # OTLP gRPC
    restart: unless-stopped
