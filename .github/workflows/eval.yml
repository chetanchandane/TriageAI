name: TriageAI Eval

on:
  workflow_dispatch:

jobs:
  safety-gate:
    name: Safety gate (zero FN required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/seed_policy.py
        env:
          LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
      # Sprint 10: gate logic moved into the harness itself (--gate exits
      # non-zero on any missed emergency, run error, or vacuous dataset).
      - run: python scripts/run_eval.py --safety-only --gate
        env:
          LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-eval-${{ github.run_id }}
          path: tests/eval_results.json

  full-eval:
    name: Full eval (nightly + main)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/seed_policy.py
        env:
          LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
      - run: python scripts/run_eval.py
        env:
          LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: "TriageAI"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-eval-${{ github.run_id }}
          path: tests/eval_results.json
